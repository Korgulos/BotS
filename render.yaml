# Prototype: free Postgres expires after 30 days. Upgrade before storing long-term history.
services:
  - type: web
    name: swgoh-inspector-cloud
    runtime: python
    plan: free
    region: frankfurt
    rootDir: cloud
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn swgoh_cloud.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: CLOUD_DOCS
        value: "false"
      - key: CLOUD_ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: swgoh-inspector-db
          property: connectionString

databases:
  - name: swgoh-inspector-db
    plan: free
    region: frankfurt
    databaseName: swgoh_inspector
    user: swgoh_inspector
    postgresMajorVersion: "18"
    ipAllowList: []
