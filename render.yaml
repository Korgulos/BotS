# Render API + existing Neon PostgreSQL. Set both database secrets privately.
services:
  - type: web
    name: swgoh-inspector-cloud
    runtime: python
    plan: free
    region: frankfurt
    rootDir: cloud
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn swgoh_cloud.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: CLOUD_DOCS
        value: "false"
      - key: CLOUD_ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
